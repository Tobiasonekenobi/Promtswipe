<title>PromptSwipe</title>
<meta name="description" content="PromptSwipe: swipe gennem danske AI-prompts, gem dine favoritter og sæt dine værktøjer op.">
<meta property="og:title" content="PromptSwipe">
<meta property="og:description" content="Giv dine idéer liv med AI. Swipe, gem og brug færdige prompts.">
<meta property="og:type" content="website">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ét mobilformat (max 440px). Velkomst uden tabbar; ellers topbar + scrollbart indhold + glas-tabbar med rund Swipe-knap i midten. Bundark (sheet) til kort, værktøjer og mix. */
:root{
  --bg:#100f13; --bg-glow1:rgba(255,150,70,.20); --bg-glow2:rgba(228,169,220,.10);
  --surface:#29222d; --surface-2:#352d38; --line:#493c4a;
  --fg:#faf5f7; --muted:#c4b9c5;
  --accent:#ffab51; --accent-2:#ffcf8b; --pink:#e4a9dc;
  --ok:#5edb9a; --bad:#ff7c86; --track:rgba(255,255,255,.16);
  --glass:rgba(41,34,45,.78); --shadow:0 18px 40px -16px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.6); --ong:#25140b;
  --grad:linear-gradient(135deg,#ffab51 0%,#ffcf8b 100%);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --disp:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark}
:root[data-ps="papir"],:root[data-theme="light"]{
  --bg:#fbf4ec; --bg-glow1:rgba(255,171,81,.30); --bg-glow2:rgba(228,169,220,.22);
  --surface:#ffffff; --surface-2:#f4e6d8; --line:rgba(70,40,15,.16);
  --fg:#25140b; --muted:#7a6554;
  --accent:#d9731a; --accent-2:#ffab51; --pink:#c0589f;
  --ok:#12a574; --bad:#e5385f; --track:rgba(70,40,15,.16);
  --glass:rgba(255,255,255,.8); --shadow:0 18px 40px -18px rgba(120,60,10,.35);
  --scrim:rgba(40,20,5,.42); --ong:#25140b;
  --grad:linear-gradient(135deg,#ffab51 0%,#ffcf8b 100%);
  color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); font-size:15px; line-height:1.45; color:var(--fg);
  background:
    radial-gradient(60% 40% at 15% 0%,var(--bg-glow1),transparent 70%),
    radial-gradient(60% 40% at 90% 100%,var(--bg-glow2),transparent 70%),
    var(--bg);
  background-color:var(--bg);
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; justify-content:center; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit; text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{display:block; flex:none}

.app{width:100%; max-width:440px; height:100%; display:flex; flex-direction:column; position:relative; min-width:0}
@media (min-width:560px){
  body{align-items:center; padding-block:24px}
  .app{height:min(100%,860px); border:1px solid var(--line); border-radius:38px; background:color-mix(in srgb,var(--bg) 70%,transparent); overflow:hidden; box-shadow:var(--shadow)}
}
#view{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0 16px 8px; display:flex; flex-direction:column; scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.stack{display:flex; flex-direction:column; gap:14px; padding-bottom:18px}

/* Topbar og ordmærke */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 6px; flex:none}
.bar h1{font-size:17px; font-weight:700; letter-spacing:-.01em; text-align:center}
.bar .ttl{display:flex; flex-direction:column; align-items:center; min-width:0}
.bar .ttl h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.bar .ttl span{font-size:12px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.bar .ttl span b{color:var(--fg); font-weight:800}
.sp{width:40px; flex:none}
.wm{display:inline-flex; align-items:center; gap:8px; font-size:19px; letter-spacing:-.025em}
.wm-ic{width:32px; height:32px; border-radius:11px; display:grid; place-items:center; background:var(--grad); color:#fff}
.wl{font-weight:400}
.wb{font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.round{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); flex:none}
.round.grad{background:var(--grad); border:0; color:#fff; font-weight:800; font-size:16px}
.round.sm{width:36px; height:36px}
.round[disabled]{opacity:.35; cursor:default}

.hello{font-size:14px; font-weight:700; color:var(--accent); margin-bottom:-8px}
.title{font-size:31px; font-weight:800; letter-spacing:-.035em; line-height:1.1; text-wrap:balance}
.lead{color:var(--muted); font-size:14.5px; margin-top:-6px}
h3.sec{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:6px 0 -4px}
.note{font-size:13px; color:var(--muted)}
.note a,.textlink{color:var(--accent); font-weight:700}
.textlink{align-self:center; font-size:14px; padding:6px}

/* Velkomst */
.wel{flex:1; display:flex; flex-direction:column; gap:24px; padding:30px 0 14px}
.wel-top{display:flex; flex-direction:column; gap:10px}
.appicon{width:64px; height:64px; border-radius:21px; display:grid; place-items:center; background:var(--grad); color:#fff; box-shadow:0 18px 34px -14px var(--accent); transform:rotate(-6deg)}
.wordmark{font-size:44px; font-weight:800; letter-spacing:-.035em; line-height:1; margin-top:10px}
.tagline{font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1.2; text-wrap:balance}
.sub{color:var(--muted); font-size:15px; line-height:1.55; font-weight:500; max-width:34ch}
.eyebrow{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
.gallery{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:2px 16px 10px; scrollbar-width:none}
.gallery::-webkit-scrollbar,.packs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.gcard{flex:none; width:148px; height:188px; border-radius:22px; position:relative; overflow:hidden; scroll-snap-align:start; text-align:left; color:#fff; box-shadow:var(--shadow);
  background:
    radial-gradient(circle at 25% 20%,hsl(var(--h) 95% 68%/.95),transparent 55%),
    radial-gradient(circle at 85% 80%,hsl(calc(var(--h) + 70) 90% 62%/.85),transparent 58%),
    linear-gradient(160deg,hsl(var(--h) 55% 32%),hsl(calc(var(--h) + 50) 60% 16%))}
.gorb{position:absolute; left:14px; top:14px; width:52px; height:52px; border-radius:17px; display:grid; place-items:center; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); transform:rotate(-6deg)}
.kcard{background:linear-gradient(160deg,hsl(var(--h) 52% 34%),hsl(calc(var(--h) + 40) 48% 15%));width:160px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:14px;height:188px}
.kcard .kl{position:absolute;right:12px;top:16px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);z-index:1}
.kcard .kc{position:static;padding:0;background:none;font-family:ui-monospace,monospace;font-size:17px;font-weight:800;word-break:break-all;z-index:1}
.kcard .kd{font-size:12.5px;line-height:1.35;opacity:.92;z-index:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kcard .kt{font-size:11px;font-weight:700;opacity:.8;z-index:1}
.galnote{margin:-2px 0 6px;font-size:12.5px;color:var(--muted)}
.galnote a{color:var(--accent);font-weight:700}
.gcard b{position:absolute; left:0; right:0; bottom:0; padding:34px 14px 14px; font-size:14.5px; font-weight:800; line-height:1.25; letter-spacing:-.01em; background:linear-gradient(transparent,rgba(12,8,30,.6))}
.wel-cta{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.fine{text-align:center; font-size:12.5px; color:var(--muted)}

/* Emnevælger */
.hero-tile{display:flex; align-items:center; gap:14px; padding:16px; border-radius:24px; background:var(--grad); color:#fff; text-align:left; box-shadow:0 18px 34px -18px var(--accent); width:100%}
.hero-tile .hi{width:46px; height:46px; border-radius:15px; display:grid; place-items:center; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); flex:none}
.hero-tile .txt{flex:1; min-width:0}
.hero-tile b{display:block; font-size:16px; font-weight:800}
.hero-tile small{font-size:12.5px; opacity:.88}
.topics{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.topic{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:14px; border-radius:22px; background:var(--glass); border:1px solid var(--line); text-align:left; min-width:0; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.topic b{font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.2}
.topic small{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-top:2px}
.topic.locked .ico{filter:grayscale(1); opacity:.45}
.topic .lockb{position:absolute; right:12px; top:12px; color:var(--muted)}
.ico{width:46px; height:46px; border-radius:15px; display:grid; place-items:center; color:#fff; flex:none; background:linear-gradient(135deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 55) 80% 52%))}
.filt{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px; border:1px dashed var(--line); font-size:12.5px; color:var(--muted)}
.filt span{flex:1; min-width:0}
.filt b{color:var(--fg)}
.filt .ch{flex:none; color:var(--accent); font-weight:800}
.resume{display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:20px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow)}
.resume .top{display:flex; align-items:center; gap:12px}

/* Rækker og lister */
.list{display:flex; flex-direction:column; gap:8px}
.row{display:flex; align-items:center; gap:8px; padding:10px 10px 10px 12px; border-radius:18px; background:var(--glass); border:1px solid var(--line); min-width:0}
.row-main{flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-align:left}
.row .ico,.resume .ico,.kit-h .ico{width:40px; height:40px; border-radius:13px}
.txt{flex:1; min-width:0}
.txt b{display:block; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.txt .s{display:block; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tp{font-style:normal; font-weight:700; color:var(--accent)}
.mini{flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); color:var(--muted)}
.mini.on{background:var(--grad); color:#fff; border-color:transparent}
.mini.on svg{fill:currentColor}
.mini.plain.on svg{fill:none}
.chev{color:var(--muted); flex:none}

/* Søg og chips */
.search{display:flex; align-items:center; gap:10px; padding:0 14px; height:46px; border-radius:99px; background:var(--glass); border:1px solid var(--line); color:var(--muted); flex:none}
.search input{flex:1; min-width:0; background:none; border:0; color:var(--fg); font:inherit; outline:none; height:100%}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:2px 16px; scrollbar-width:none; flex:none}
.chip{flex:none; padding:7px 14px; border-radius:99px; border:1px solid var(--line); background:var(--glass); font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap}
.chip.on{background:var(--grad); color:#fff; border-color:transparent}

/* Swipe */
.prog{flex:none; height:6px; border-radius:99px; background:var(--track); overflow:hidden; margin:6px 0 12px}
.prog i,.bar-i{display:block; height:100%; background:var(--grad); border-radius:inherit; transition:width .3s}
.track{height:6px; border-radius:99px; background:var(--track); overflow:hidden}
.deck{position:relative; flex:1; min-height:330px; max-height:520px}
.card{position:absolute; inset:0 0 28px; border-radius:26px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; touch-action:pan-y; user-select:none; -webkit-user-select:none; z-index:var(--z);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s; --pr:0; --pl:0}
.card[data-i="1"]{transform:translateY(12px) scale(.95); opacity:.85}
.card[data-i="2"]{transform:translateY(24px) scale(.90); opacity:.6}
.card.top{cursor:grab}
.art{position:relative; flex:0 0 44%; display:grid; place-items:center;
  background:
    radial-gradient(circle at 28% 22%,hsl(var(--h) 95% 68%/.95),transparent 55%),
    radial-gradient(circle at 82% 78%,hsl(calc(var(--h) + 70) 90% 62%/.85),transparent 58%),
    linear-gradient(160deg,hsl(var(--h) 55% 30%),hsl(calc(var(--h) + 50) 60% 16%))}
.cov{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover}
.orb{position:absolute; left:14px; bottom:14px; width:44px; height:44px; border-radius:15px; display:grid; place-items:center; color:#fff; background:rgba(20,14,40,.4); border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.pill{position:absolute; left:14px; top:14px; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; color:#fff; background:rgba(20,14,40,.38); border:1px solid rgba(255,255,255,.3); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.fav{position:absolute; right:12px; top:12px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(20,14,40,.38); border:1px solid rgba(255,255,255,.3)}
.fav.on{color:#ffd45e}
.fav.on svg{fill:currentColor}
.stamp{position:absolute; top:62px; padding:4px 12px; border:3px solid; border-radius:10px; font-weight:800; font-size:18px; letter-spacing:.04em; transform:rotate(-12deg); background:rgba(0,0,0,.25)}
.s-r{left:16px; color:#ffd45e; opacity:var(--pr)}
.s-l{right:16px; color:#ff7a96; transform:rotate(12deg); opacity:var(--pl)}
.body{flex:1; min-height:0; padding:16px 18px 14px; display:flex; flex-direction:column; gap:8px}
.body h2{font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.2}
.body p{color:var(--muted); font-size:14px; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden}
.tags{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:auto}
.tags span.t{font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:99px; background:var(--surface-2); color:var(--muted)}
.lv{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; color:var(--muted); margin-right:4px}
.lv i{width:6px; height:6px; border-radius:50%; background:var(--track)}
.lv i.on{background:var(--accent)}
.lv em{font-style:normal; margin-left:3px}

.actions{display:flex; justify-content:center; align-items:center; gap:22px; padding:6px 0 10px; flex:none}
.act{width:62px; height:62px; border-radius:50%; display:grid; place-items:center; background:var(--glass); border:2px solid; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); transition:transform .15s}
.act:active{transform:scale(.92)}
.act.no{color:var(--bad); border-color:var(--bad)}
.act.yes{color:#fff; border-color:transparent; background:var(--grad); box-shadow:0 14px 28px -12px var(--accent)}
.act.sm{width:48px; height:48px; color:var(--muted); border-color:var(--line)}
.hint{text-align:center; font-size:12.5px; color:var(--muted); padding-bottom:8px; flex:none}

.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:24px 8px}
.empty h2{font-size:22px; font-weight:800; letter-spacing:-.02em; text-wrap:balance}
.empty p{color:var(--muted); max-width:30ch}
.glyph{width:72px; height:72px; border-radius:24px; display:grid; place-items:center; background:var(--grad); color:#fff}

/* Knapper */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:99px; font-weight:700; font-size:15px; background:var(--grad); color:#fff; box-shadow:0 14px 28px -14px var(--accent); text-align:center}
.btn.ghost{background:var(--glass); color:var(--fg); border:1px solid var(--line); box-shadow:none}
.btn.ghost.is-on{color:var(--accent); border-color:var(--accent)}
.btn.ghost.is-on svg{fill:currentColor}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px; font-size:13px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; gap:8px; width:100%}
.btnrow .btn{flex:1; padding:12px 8px; font-size:14px}

/* Bundark */
.scrim{position:absolute; inset:0; z-index:30; background:var(--scrim); display:flex; align-items:flex-end}
.sheet{width:100%; max-height:90%; overflow-y:auto; background:var(--surface); border-radius:28px 28px 0 0; border:1px solid var(--line); border-bottom:0; padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; box-shadow:0 -20px 50px -20px rgba(0,0,0,.45); animation:up .28s cubic-bezier(.2,.8,.2,1); scrollbar-width:none}
@keyframes up{from{transform:translateY(48px); opacity:.3}}
.grab{width:40px; height:5px; border-radius:99px; background:var(--track); margin:2px auto 2px; flex:none}
.sh-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
.pill2{display:inline-flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; border-radius:99px; background:var(--surface-2); font-size:12.5px; font-weight:700}
.pill2 .ico{width:26px; height:26px; border-radius:50%}
.sh-title{font-size:23px; font-weight:800; letter-spacing:-.025em; line-height:1.2; text-wrap:balance}
.sh-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.sh-meta span.t{font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:99px; background:var(--surface-2); color:var(--muted)}
.ptext{white-space:pre-wrap; font-size:15px; line-height:1.55; background:var(--surface-2); border-radius:16px; padding:14px 16px; user-select:text; -webkit-user-select:text}
.ptext mark{background:color-mix(in srgb,var(--accent) 22%,transparent); color:inherit; border-radius:5px; padding:0 3px; font-weight:700}
.sh-foot{font-size:12.5px; color:var(--muted); text-align:center}
.sh-foot a{color:var(--accent); font-weight:700}
.done{display:grid; place-items:center; width:56px; height:56px; border-radius:50%; background:color-mix(in srgb,var(--ok) 18%,transparent); border:2px solid var(--ok); color:var(--ok); margin:4px auto 0}
.kv{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.lbl{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:700; margin-bottom:2px}
.lbl output{color:var(--accent); font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:99px; background:linear-gradient(90deg,var(--accent) var(--v),var(--track) var(--v))}
input[type=range]::-moz-range-track{height:6px; border-radius:99px; background:var(--track)}
input[type=range]::-moz-range-progress{height:6px; border-radius:99px; background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:5px solid var(--accent); margin-top:-8px; box-shadow:0 4px 10px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:#fff; border:5px solid var(--accent)}
.seg{display:flex; gap:8px}
.seg button{flex:1; padding:10px 6px; border-radius:14px; border:1px solid var(--line); font-size:13px; font-weight:700; color:var(--muted); background:var(--surface-2)}
.seg button.on{background:var(--grad); color:#fff; border-color:transparent}
.seg .n{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; margin-left:6px; border-radius:99px; background:var(--pink); color:#fff; font-size:11px; font-weight:800}
.pchips{display:flex; flex-wrap:wrap; gap:8px}
.pchip{padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:600; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pchip.on{background:var(--grad); color:#fff; border-color:transparent}
.howto{margin:0; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:8px}
.howto li{counter-increment:s; display:flex; gap:10px; font-size:14px; line-height:1.45}
.howto li::before{content:counter(s); flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--surface-2); color:var(--accent)}
.sh-big{display:flex; align-items:center; gap:14px}
.sh-big .ico{width:56px; height:56px; border-radius:18px}

/* Favoritter */
.mixcta{display:flex; align-items:center; gap:14px; padding:14px; border-radius:22px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); text-align:left; width:100%}
.mixcta .hi{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--grad); color:#fff; flex:none}

/* Værktøjskasse */
.explain{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.explain div{padding:12px 14px; border-radius:18px; background:var(--glass); border:1px solid var(--line); font-size:12.5px; color:var(--muted); line-height:1.4}
.explain b{display:block; color:var(--fg); font-size:14px; margin-bottom:2px}
.packs{display:flex; gap:10px; overflow-x:auto; margin:0 -16px; padding:2px 16px 12px; scrollbar-width:none}
.pack{flex:none; width:206px; padding:14px; border-radius:22px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow)}
.pack-ics{display:flex; padding-left:2px}
.pack-ics span{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:#fff; margin-left:-8px; border:2px solid var(--surface); background:linear-gradient(135deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 55) 80% 52%))}
.pack-ics span:first-child{margin-left:0}
.pack b{font-size:15px; font-weight:800}
.pack small{color:var(--muted); font-size:12px; line-height:1.35; min-height:32px}
.pack .btn{margin-top:auto}
.kit{padding:14px; border-radius:22px; background:var(--glass); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.kit-h{display:flex; align-items:center; gap:12px}
.ring{width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--track) 0); position:relative}
.ring::before{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--surface)}
.ring span{position:relative}
.ring.ok{background:var(--ok); color:#fff}
.ring.ok::before{display:none}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.step{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:9px 10px; border-radius:14px; background:var(--surface-2); font-size:13.5px; line-height:1.4; width:100%}
.step .box{width:22px; height:22px; border-radius:7px; border:2px solid var(--muted); flex:none; display:grid; place-items:center; color:transparent}
.step[aria-checked="true"] .box{background:var(--ok); border-color:var(--ok); color:#fff}
.step[aria-checked="true"] .st{color:var(--muted)}
.sumpanel{padding:14px 16px; border-radius:22px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px}
.sumpanel .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.sumpanel b{font-size:16px; font-weight:800}
.sumpanel span{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}

/* Indstillinger */
.set{display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:22px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.set h2{font-size:15px; font-weight:800; letter-spacing:-.01em}
.field{display:flex; align-items:center; height:48px; padding:0 14px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line)}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1; min-width:0; background:none; border:0; color:var(--fg); font:inherit; outline:none; height:100%}
.lvls{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.lvls button{padding:11px 10px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2); text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.lvls button b{font-size:14px; font-weight:800}
.lvls button small{font-size:11.5px; color:var(--muted); line-height:1.3}
.lvls button.on{background:var(--grad); color:#fff; border-color:transparent}
.lvls button.on small{color:rgba(255,255,255,.88)}
.lvls button.on .lv i{background:rgba(255,255,255,.4)}
.lvls button.on .lv i.on{background:#fff}
.swrow{display:flex; align-items:center; gap:14px}
.swrow .txt b{white-space:normal}
.swrow .txt .s{white-space:normal}
.switch{width:52px; height:32px; border-radius:99px; background:var(--track); position:relative; flex:none; transition:background .2s}
.switch::after{content:""; position:absolute; left:3px; top:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25); transition:transform .2s}
.switch[aria-checked="true"]{background:var(--grad)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.radios{display:flex; flex-direction:column}
.radio{display:flex; align-items:center; gap:12px; padding:11px 2px; border-top:1px solid var(--line); width:100%; text-align:left}
.radio:first-child{border-top:0; padding-top:2px}
.radio .rd{width:22px; height:22px; border-radius:50%; border:2px solid var(--muted); display:grid; place-items:center; flex:none}
.radio[aria-checked="true"] .rd{border-color:var(--accent)}
.radio[aria-checked="true"] .rd::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--accent)}
.radio b{display:block; font-size:14.5px; font-weight:700}
.radio small{display:block; color:var(--muted); font-size:12px}
.themes{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.th{display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px 8px 10px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2); font-size:12.5px; font-weight:700; color:var(--muted)}
.th.on{box-shadow:inset 0 0 0 2px var(--accent); color:var(--fg)}
.sw{width:100%; height:46px; border-radius:11px; border:1px solid var(--line); position:relative; overflow:hidden}
.sw::after{content:""; position:absolute; right:8px; bottom:8px; width:16px; height:16px; border-radius:50%}
.sw-papir{background:#f3f1fb}
.sw-papir::after{background:linear-gradient(135deg,#b45cff,#5b7cff)}
.sw-blaek{background:#0a0914}
.sw-blaek::after{background:linear-gradient(135deg,#c26bff,#6a85ff)}
.sw-auto{background:linear-gradient(135deg,#f3f1fb 50%,#0a0914 50%)}
.sw-auto::after{background:linear-gradient(135deg,#b45cff,#5b7cff)}
.srcs{display:flex; flex-direction:column}
.srcs a{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); color:var(--accent); font-weight:700; font-size:14px}
.srcs a:first-child{border-top:0}

/* Tabbar */
.tabs{flex:none; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:end; margin:0 10px 10px; padding:6px 4px; border-radius:28px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:var(--shadow)}
.app.welc .tabs{display:none}
.tab{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:3px; height:50px; padding-bottom:3px; color:var(--muted); font-size:10.5px; font-weight:700; letter-spacing:-.01em; min-width:0}
.tab .l{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.tab .ti{position:relative}
.tab.on{color:var(--accent)}
.tab.on .ti svg{stroke-width:2.2}
.tab.mid .mc{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background:var(--grad); color:#fff; margin-top:-28px; box-shadow:0 12px 26px -8px var(--accent),0 0 0 5px color-mix(in srgb,var(--bg) 80%,transparent)}
.badge{position:absolute; top:-6px; right:-10px; min-width:19px; height:19px; padding:0 5px; border-radius:99px; background:var(--pink); color:#fff; font-size:10.5px; font-weight:800; display:grid; place-items:center; border:2px solid var(--bg)}

#toast{position:absolute; left:50%; bottom:96px; transform:translate(-50%,16px); opacity:0; pointer-events:none; padding:10px 16px; border-radius:99px; background:var(--fg); color:var(--bg); font-size:13px; font-weight:700; transition:.25s; white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis; z-index:40}
#toast.show{opacity:1; transform:translate(-50%,0)}
.app.has-sheet #toast{bottom:auto; top:16px; transform:translate(-50%,-16px)}
.app.has-sheet #toast.show{transform:translate(-50%,0)}

/* Billedguide */
.sheet.gsheet{max-height:94%;min-height:70%}
.gdots{display:flex;gap:6px;justify-content:center;margin:2px 0 4px}.gdots i{height:5px;flex:1;max-width:46px;border-radius:99px;background:var(--track)}.gdots i.done{background:color-mix(in srgb,var(--accent) 55%,transparent)}.gdots i.cur{background:var(--accent)}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.gtop .sh-title{margin:0}
.gsurp{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;font-weight:800;font-size:13px;background:var(--grad);color:#fff;box-shadow:0 10px 22px -12px var(--accent)}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gopt{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;padding:8px;border-radius:18px;background:var(--surface-2);border:2px solid transparent;color:var(--fg);min-width:0}
.gopt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));box-shadow:0 10px 24px -14px var(--accent)}
.gopt.big{padding:14px}.gopt.big .gn{gap:8px}
.gth{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface);display:block}.gth svg{width:100%;height:100%;display:block}
.ggrid.lt .gth{aspect-ratio:16/10}.ggrid.fr{grid-template-columns:repeat(3,1fr)}.ggrid.fr .gd{display:none}.ggrid.fr .gn{font-size:12px}
.gth.gico{display:grid;place-items:center;color:var(--fg);background:var(--surface);aspect-ratio:1.5/1}.gth.gico svg{width:62%;height:100%}
.gn{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;line-height:1.2;padding:0 2px}
.gd{font-size:11.5px;line-height:1.35;color:var(--muted);padding:0 2px 2px}
.gtick{margin-left:auto;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--ong);flex:none}
.gmode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gup{display:flex;flex-direction:column;gap:10px}.gup>div{display:flex;gap:10px;align-items:center}.gup img{width:72px;height:72px;object-fit:cover;border-radius:14px;flex:none}.gup .note{margin:2px 0 0;font-size:12px}
.gfile{cursor:pointer}
.gwarn{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:14px;font-size:12.5px;line-height:1.4;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--fg)}.gwarn .ic{flex:none;margin-top:1px;color:var(--accent)}
.gvid{border-radius:16px;background:var(--surface-2);padding:2px 12px}.gvid summary{cursor:pointer;font-weight:800;font-size:13.5px;padding:11px 0;display:flex;align-items:center;gap:8px;list-style:none}.gvid summary::-webkit-details-marker{display:none}.gvid video{width:100%;max-height:60vh;border-radius:12px;margin:0 0 12px;background:#000}.gtopbtn{align-self:center;padding:9px 16px;font-size:13px;margin:0 auto 4px}.gnav{display:flex;gap:8px;position:sticky;bottom:-2px;padding:10px 0 2px;background:linear-gradient(0deg,var(--surface) 70%,transparent)}.gnav .btn{flex:1}.gnav .btn:last-child{flex:1.4}.gnav .btn[disabled]{opacity:.45}
.gsum{display:flex;flex-wrap:wrap;gap:6px}.gchip{padding:7px 11px;border-radius:99px;font-size:12px;background:var(--surface-2);color:var(--muted);border:1.5px solid transparent}.gchip b{color:var(--fg)}.gchip.on{border-color:var(--accent)}.gchip.on b{color:var(--accent)}
.gtext{width:100%;box-sizing:border-box;border-radius:16px;padding:12px;font:12.5px/1.5 var(--font);background:var(--surface-2);color:var(--fg);border:1.5px solid var(--line);resize:vertical;min-height:180px}.gtext:focus{border-color:var(--accent);outline:none}
@media (prefers-reduced-motion:reduce){.card,#toast,.act,.sheet,.switch,.switch::after,.prog i{transition:none; animation:none}}

/* V18-look: varm mørk palet, orange accent, display-skrift og fersken-kort */
h1,h2,h3,.title,.wordmark,.tagline,.wb,.wl,.sh-title{font-family:var(--disp)}
.wm-ic,.round.grad,.appicon,.hero-tile,.mini.on,.chip.on,.act.yes,.glyph,.btn.primary,.seg button.on,.pchip.on,.mixcta .hi,.lvls button.on,.tab.mid .mc{color:var(--ong)}
.card{background:linear-gradient(165deg,#ffe3a3 0%,#ffd0cf 55%,#ffc2e0 100%); border:0; color:#25140b; border-radius:28px}
.card .body{padding:14px 18px 16px; gap:6px}
.card .body h2{font-family:var(--disp); font-weight:800; font-size:23px; letter-spacing:-.02em; color:#25140b}
.card .body p{color:#5a4048}
.card .tags span.t{background:rgba(37,20,11,.1); color:#5a4048}
.card .lv{color:#5a4048}.card .lv i{background:rgba(37,20,11,.2)}.card .lv i.on{background:#e5821f}
.pill{background:rgba(255,236,190,.92); color:#25140b; border:0; font-weight:800}

.pbox{border:1px solid rgba(37,20,11,.18); background:rgba(255,255,255,.4); border-radius:14px; padding:8px 12px; font-size:13px; color:#3b2630}
.pbox b{display:block; font-size:12px; font-weight:800; color:#25140b; margin-bottom:2px}
.pbox span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.act.no{background:#7a2438; color:#fff; border-color:transparent}
.act.sm{background:var(--glass)}
.btn{color:var(--ong)}
.btn.ghost{color:var(--fg)}
.btn.ghost.is-on{color:var(--accent)}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.tile{position:relative; border-radius:20px; background:var(--surface); border:1px solid var(--line); overflow:hidden; min-width:0}
.tile-main{display:flex; flex-direction:column; width:100%; text-align:left; gap:4px; padding:0 0 12px; align-items:stretch}
.tcov{position:relative; display:block; height:128px; overflow:hidden; background:#222}
.tcov .cov{position:absolute; inset:0; width:100%; height:100%}
.tmeta{font-size:12px; color:var(--accent); padding:8px 12px 0}
.ttl2{overflow-wrap:anywhere; hyphens:auto; font-family:var(--disp); font-size:16px; font-weight:800; letter-spacing:-.01em; line-height:1.15; padding:0 12px; color:var(--fg)}
.tdesc{font-size:13px; color:var(--muted); padding:0 12px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.tfav{position:absolute; right:8px; top:8px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(20,14,25,.5); border:1px solid rgba(255,255,255,.3)}
.tfav.on{background:var(--grad); color:var(--ong); border-color:transparent}
.tfav.on svg{fill:currentColor}
.shcov{position:relative; height:210px; border-radius:20px; overflow:hidden; flex:none}
.shcov .cov{position:absolute; inset:0; width:100%; height:100%}
.sh-title{font-style:italic; font-weight:800}

/* tåler stor skriftstørrelse på telefonen */
.tab{font-size:9.5px}
.tab .l{letter-spacing:-.02em}
.card .art{flex:0 0 50%}
.card .body{padding:12px 16px 14px; gap:8px; justify-content:flex-start; overflow:hidden}
.card .body h2{font-size:19px; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

.bar .ttl h1{font-size:16px}
.pill{font-size:11px; padding:4px 10px}
@media (max-height:820px){.hint{display:none}}

/* ---- samlet version: nye elementer og rettelser ---- */
.sw-papir{background:#fbf4ec}.sw-papir::after{background:linear-gradient(135deg,#ffab51,#ffcf8b)}
.sw-blaek{background:#100f13}.sw-blaek::after{background:linear-gradient(135deg,#ffab51,#ffcf8b)}
.sw-auto{background:linear-gradient(135deg,#fbf4ec 50%,#100f13 50%)}.sw-auto::after{background:linear-gradient(135deg,#ffab51,#ffcf8b)}
.codebadge{position:absolute; left:12px; bottom:12px; max-width:calc(100% - 24px); padding:6px 11px; border-radius:11px; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:13px; letter-spacing:-.01em; color:#ffe9c9; background:rgba(20,12,8,.72); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .art .orb{display:none}
.ptext.code{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:15px; font-weight:700}
.streak{display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px; border-radius:99px; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); font-weight:800; font-size:12.5px}

function rlPick(i){
  const used=RL.codes.filter((c,j)=>c&&j!==i),ug=new Set(used.map(c=>c[5])),uc=new Set(used.map(c=>c[0]));

  const gs=[...new Set(pool.map(c=>c[5]))],g=gs[Math.floor(Math.random()*gs.length)],ps=pool.filter(c=>c[5]===g);

  document.querySelectorAll('#sheet .kchip').forEach(b=>{const on=b.dataset.k===st.code;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  const s=$('#kbsel');if(s)s.innerHTML='<b>'+esc(st.code)+'</b> — '+esc(d?d[1]:'');
  const pt=$('#ptext');if(pt)pt.textContent=kbPrompt(p);
}
function kbFilterChips(id){
  const p=BY[id];if(!p)return;const st=kbState(p),q=st.q.trim().toLowerCase();let n=0;
  document.querySelectorAll('#sheet .kchip').forEach(b=>{const ok=!q||(b.dataset.k+' '+b.lastChild.textContent).toLowerCase().includes(q);b.hidden=!ok;if(ok)n++});
  const c=$('#kbcnt');if(!c)return;
  if(!q||n){c.textContent=q?n+(n===1?' kode matcher':' koder matcher'):'';return}
  const term=st.q.trim(),hits=KB.filter(x=>x[2]!==p.kb&&(x[0]+' '+x[1]).toLowerCase().includes(q));
  let h='<span class="kbfall"><span>Ingen koder matcher «'+esc(term)+'»</span>';
  if(hits.length){
    h+='<button class="btn ghost wide kbgo" type="button" data-a="kbglobal" data-k="'+esc(term)+'">'+icon('search',16)+'Søg efter «'+esc(term)+'» i alle '+KB.length+' koder i stedet</button>'+
      '<span class="kbsep">Fundet i andre kodepakker</span>'+
      hits.slice(0,5).map(x=>{const pk=KBC.find(k=>k.id===x[2]);return '<span class="krow"><button class="kmain" type="button" data-a="kbcopy" data-k="'+esc(x[0])+'" aria-label="Kopiér '+esc(x[0])+'"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span>'+(pk?'<span class="kbpk">'+esc(pk.name)+'</span>':'')+'</button></span>'}).join('');
  }else h+='<span>Heller ikke i de andre kodepakker.</span>';
  c.innerHTML=h+'</span>';
}
let kbQ='',kbCatF='alle',kbType='alle';
function kbRows(){
  const q=kbQ.trim().toLowerCase();
  const rows=KB.filter(c=>(kbCatF==='alle'||c[2]===+kbCatF)&&(kbType==='alle'||(kbType==='video')===!!c[3])&&(!q||(c[0]+' '+c[1]).toLowerCase().includes(q)));

function kbHow(open){
  return '<details class="kbhow"'+(open?' open':'')+'><summary>Sådan bruger du koderne</summary><div>'+
  '<p><b>1. Foto + kode.</b> Vedhæft dit udgangsfoto (fx en selfie eller et produktfoto), skriv koden, og tilføj evt. én linje med dine egne detaljer. Fx <code>/staticad</code> til mit kaffebrand, mørkegrøn stil, overskrift: Vågn bedre op.</p>'+
  '<p><b>ChatGPT og Higgsfield.</b> Koderne virker direkte i ChatGPT og i Higgsfield. Vil du bruge Claude til billeder eller video, så tilføj Higgsfield under <i>Customize → Connectors → Add custom connector</i> med adressen <code>https://mcp.higgsfield.ai/mcp</code>, og log ind på din konto hos higgsfield.ai.</p>'+
  '<p><b>Canva.</b> Canva bruger ikke slash-koder automatisk. Kopiér både koden og den danske beskrivelse af effekten ind i tekstfeltet sammen med dit motiv.</p>'+
  '</div></details>';
}
function vKodebog(v){
  v.innerHTML='<div class="stack"><header class="bar"><a class="round" href="#katalog" aria-label="Tilbage til kataloget">'+icon('back',20)+'</a><h1>Kodebog</h1><span class="sp"></span></header>'+

    '<button class="kbbtn" data-a="roulette"><span class="ic">'+icon('shuffle',20)+'</span><span><b>🎲 Tilfældig billed- &amp; kode-roulette</b><span class="s">Vælg dit foto-motiv og få tilfældige koder</span></span></button>'+
    '<label class="search">'+icon('search',19)+'<input id="kbq" type="search" placeholder="Søg i alle '+KB.length+' koder" value="'+esc(kbQ)+'" autocomplete="off" aria-label="Søg i koderne"></label>'+
    '<div class="chips" role="group" aria-label="Filtrér på type">'+[['alle','Alle'],['billede','Billede'],['video','Video']].map(([k,l])=>'<button class="chip'+(kbType===k?' on':'')+'" data-a="kbtype" data-k="'+k+'" aria-pressed="'+(kbType===k)+'">'+l+'</button>').join('')+'</div>'+
    '<div class="chips" role="group" aria-label="Filtrér på kategori"><button class="chip'+(kbCatF==='alle'?' on':'')+'" data-a="kbcat" data-k="alle" aria-pressed="'+(kbCatF==='alle')+'">Alle kategorier</button>'+KBC.map(k=>'<button class="chip'+(kbCatF===String(k.id)?' on':'')+'" data-a="kbcat" data-k="'+k.id+'" aria-pressed="'+(kbCatF===String(k.id))+'">'+esc(k.name)+'</button>').join('')+'</div>'+
    '<p class="note" id="kbn"></p><div class="klist" id="kbl"></div></div>';
  kbRows();
  $('#kbq').addEventListener('input',e=>{kbQ=e.target.value;kbRows()});
}

function vk(t){
  if(!t.variants)return null;
  const pref=S.ai==='claude'?'Claude':S.ai==='chatgpt'?'ChatGPT':null;
  return pref&&t.variants[pref]?pref:Object.keys(t.variants)[0];
}
const skey=t=>t.id+(vk(t)?'|'+vk(t):'');
const promptFor=t=>{const k=vk(t);return (k&&t.variants[k].prompt)||t.prompt};

function availNote(t){
  const k=vk(t);if(!k)return '';
  const pref=S.ai==='claude'?'Claude':S.ai==='chatgpt'?'ChatGPT':null;
  let m='Opsætning i <b>'+k+'</b>.';
  if(pref&&pref!==k)m+=' Findes ikke som '+pref+'-værktøj endnu.';
  else if(t.ai.length>1)m+=' Skift AI i <a href="#indstillinger">Indstillinger</a> for at se den anden vej.';
  return '<p class="note">'+m+'</p>';
}
function stepsOf(t){
  const k=vk(t);if(k&&t.variants[k].steps&&t.variants[k].steps.length)return t.variants[k].steps;
  if(t.steps)return t.steps;
  return t.type==='connector'?[
    'Åbn indstillingerne i din AI-tjeneste, og find Connectors. Hos nogle hedder det Apps eller Integrationer.',

    'Giv kun de tilladelser, opgaven kræver. Du kan altid fjerne forbindelsen igen.',

  ];
}

const KEY='promptswipe-v3';
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function touchDay(){const k=dkey(new Date());if(!S.days.includes(k)){S.days.push(k);S.days=S.days.slice(-120);save()}}
function streak(){let n=0;const d=new Date();if(!S.days.includes(dkey(d)))d.setDate(d.getDate()-1);while(S.days.includes(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}

function phTokens(text){const seen=[],set={},re=/\[([^\[\]]+)\]/g;let m;while((m=re.exec(text))){if(!set[m[1]]){set[m[1]]=1;seen.push(m[1])}}return seen}
function fillText(text,key){const v=PF[key]||{};return text.replace(/\[([^\[\]]+)\]/g,(m,t)=>(v[t]&&v[t].trim())?v[t].trim():m)}
function ptextHTML(text,key){
  const v=PF[key]||{},re=/\[([^\[\]]+)\]/g;let out='',last=0,m;
  while((m=re.exec(text))){out+=esc(text.slice(last,m.index));const val=(v[m[1]]||'').trim();out+=val?'<mark class="fl">'+esc(val)+'</mark>':'<mark>'+esc(m[0])+'</mark>';last=re.lastIndex}
  return out+esc(text.slice(last));
}

function decide(mode){
  if(mode===true)mode='yes';else if(mode===false)mode='no';
  if(!D.order||D.idx>=D.order.length)return;
  const id=D.order[D.idx],el=document.querySelector('.card.top');
  const finish=()=>{
    let saved=false,sup=false;
    if(mode==='yes'||mode==='super'){
      if(!isFav(id)){S.favs.unshift(id);saved=true}
      if(mode==='super'&&!isSup(id)){S.sup.unshift(id);sup=true}
      toast(mode==='super'?'Super-gemt, ligger øverst i Favoritter':saved?'Gemt i favoritter ('+S.favs.length+')':'Ligger allerede i favoritter');
    }
    D.hist.push({id,saved,sup});D.idx++;touchDay();save();render();
  };
  if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches){finish();return}
  const cx=el._x||0,cy=el._y||0,w=Math.max(innerWidth,500);
  const tx=mode==='yes'?w:mode==='no'?-w:cx*.3,ty=mode==='super'?-Math.max(innerHeight,600):cy+20;
  const rot=mode==='yes'?20:mode==='no'?-20:0;
  el.style.transition='transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s';
  el.style.transform='translate('+tx+'px,'+ty+'px) rotate('+rot+'deg)';el.style.opacity='0';
  el.style.setProperty(mode==='yes'?'--pr':mode==='no'?'--pl':'--pu','1');
  setTimeout(finish,280);
}
function undo(){
  const h=D.hist.pop();if(!h)return;
  if(h.saved)S.favs=S.favs.filter(x=>x!==h.id);
  if(h.sup)S.sup=S.sup.filter(x=>x!==h.id);
  D.idx=Math.max(0,D.idx-1);save();render();toast('Fortrudt');
}
function drag(el){
  const clamp=v=>Math.max(0,Math.min(1,v));
  const next=el.parentElement?el.parentElement.querySelector('.card[data-i="1"]'):null;
  let sx=0,sy=0,dx=0,dy=0,on=false,moved=false,lt=0,lx=0,vx=0,raf=0;
  const apply=()=>{
    raf=0;el._x=dx;el._y=dy;
    el.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx/18)+'deg)';
    const up=-dy>Math.abs(dx)*1.1;
    el.style.setProperty('--pr',up?0:clamp(dx/90));el.style.setProperty('--pl',up?0:clamp(-dx/90));el.style.setProperty('--pu',up?clamp(-dy/100):0);
    if(next){const pr=Math.min(1,Math.hypot(dx,dy)/140);next.style.transition='none';next.style.transform='translateY('+(12-12*pr)+'px) scale('+(.95+.05*pr)+')'}
  };
  const reset=()=>{
    el.style.transition='';el.style.transform='';el._x=0;el._y=0;['--pr','--pl','--pu'].forEach(k=>el.style.setProperty(k,0));
    if(next){next.style.transition='';next.style.transform=''}
  };
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||(e.pointerType==='mouse'&&e.button!==0))return;
    on=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;dy=0;vx=0;lx=e.clientX;lt=performance.now();
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.style.transition='none';
  });
  el.addEventListener('dragstart',e=>e.preventDefault());
  el.addEventListener('pointermove',e=>{
    if(!on)return;
    dx=e.clientX-sx;dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    moved=true;
    const t=performance.now(),dt=t-lt;if(dt>0){vx=.6*vx+.4*((e.clientX-lx)/dt)}lx=e.clientX;lt=t;
    if(!raf)raf=requestAnimationFrame(apply);
  });
  const end=tap=>{
    if(!on)return;on=false;if(raf){cancelAnimationFrame(raf);raf=0}
    if(moved){
      const thr=95;
      if(-dy>110&&-dy>Math.abs(dx)){decide('super');return}
      if(dx>thr||(vx>.7&&dx>40)){decide('yes');return}
      if(dx<-thr||(vx<-.7&&dx<-40)){decide('no');return}
    }
    reset();
    if(tap&&!moved)openSheet({kind:'prompt',id:el.dataset.id});
  };
  el.addEventListener('pointerup',()=>end(true));el.addEventListener('pointercancel',()=>end(false));
}

function buildPrompt(ids){
  const ps=ids.map(id=>BY[id]).filter(Boolean);

  const role=roles.length>1?roles.slice(0,-1).join(', ')+' og '+roles[roles.length-1]:roles[0];
  const cre=MX.cre<25?'Hold dig til gennemprøvede løsninger, og vær præcis.':MX.cre<60?'Kombinér velkendte greb med enkelte overraskende vinkler.':MX.cre<85?'Vær opfindsom, og tag mindst to uventede vinkler.':'Gå helt nye veje. Brug uventede sammenligninger, og tør bryde med konventioner.';
  const tone={Formel:'formel og høflig',Kreativ:'legende og billedrig',Professionel:'professionel, klar og tillidsvækkende'}[MX.tone];
  const cs=ps.filter(p=>p.core),rs=ps.filter(p=>!p.core);
  return 'Du er '+role+'.\n\n'+(cs.length?'Din opgave er at:\n'+cs.map(p=>'- '+p.core).join('\n')+'\n\n':'')+(rs.length?(cs.length?'Løs også disse opgaver:\n':'Din opgave:\n')+rs.map(p=>'- '+p.text.replace(/\s+/g,' ')).join('\n')+'\n\n':'')+'Krav:\n- Længde: cirka '+MX.len+' ord.\n- Kreativitet ('+MX.cre+' %): '+cre+'\n- Tone: '+tone+'.\n- Skriv på dansk, og brug korte overskrifter.\n\nHvis noget er uklart, så stil ét afklarende spørgsmål, før du begynder.';
}

    case 'fav':toggleFav(id);refresh();break;
    case 'close':closeSheet();break;
    case 'kcode':{const p=BY[id];if(p){kbState(p).code=k;kbUpdate(id)}break}
    case 'kbcopy':copyText(k,k+' er kopieret');break;
    case 'kbtype':kbType=k;render();break;
    case 'kbcat':kbCatF=k;render();break;
    case 'kbglobal':{kbQ=k;kbCatF='alle';kbType='alle';closeSheet(true);go('kodebog');break}
    case 'kbbook':{kbCatF=String(k);kbType='alle';kbQ='';closeSheet(true);go('kodebog');break}
    case 'roulette':if(RL.m<0)rlInit();openSheet({kind:'rl'});break;
    case 'rlbook':closeSheet(true);break;
    case 'rlty':RL.ty=k;if(k!=='sted')RL.sub='';rlFix();renderSheet(false);break;
    case 'rlsub':RL.sub=k;rlFix();renderSheet(false);break;
    case 'rln':RL.n=+k;RL.codes.length=Math.min(RL.codes.length,RL.n);rlFix();renderSheet(false);break;
    case 'rlroll':{const i=+b.dataset.i;if(!RL.lock[i]){RL.codes[i]=rlPick(i);renderSheet(false)}break}
    case 'rllock':{const i=+b.dataset.i;RL.lock[i]=RL.lock[i]?0:1;renderSheet(false);break}
    case 'rlall':rlRollAll();renderSheet(false);break;
    case 'hfcopy':copyText('Higgsfield på 2 minutter:\n'+KB_HF.map((x,i)=>(i+1)+'. '+x).join('\n'),'Higgsfield-guiden er kopieret','Kunne ikke kopiere guiden');break;
    case 'gtop':{const t=D.order&&BY[D.order[D.idx]];if(t&&t.cat==='billeder'&&t.kind!=='kodebog')gStart(t.id)}break;
    case 'gopen':gStart(id);break;
    case 'gmode':G.mode=k;gRerender(false);break;
    case 'gstyle':gSet('style',k);gRerender(false);break;
    case 'gang':gSet('angle',k);gRerender(false);break;
    case 'gfr':gSet('frame',k);gRerender(false);break;
    case 'glt':gSet('light',k);gRerender(false);break;
    case 'gnext':gGo(G.step+1);break;
    case 'gskip':gGo(G.step+1);break;
    case 'gback':gGo(G.step-1);break;
    case 'gstep':gGo(+k);break;
    case 'gsurp':gSurprise();break;
    case 'greset':G.edit=null;G.dirty=false;gRerender(false);break;
    case 'copy':copyText(getText(b.dataset.src),'Kopieret til udklipsholder');break;
    case 'copyopen':copyText(getText(b.dataset.src),'Kopieret · sæt ind i '+AIS[b.dataset.ai||S.ai].name,'Åbnet. Kopiér teksten, og sæt den ind');break;
    case 'mixopen':MX.result=null;MX.savedId=null;MX.sel=S.favs.filter(x=>BY[x]&&mixable(BY[x])).slice(0,3);openSheet({kind:'mix'});break;
    case 'msel':
      if(MX.sel.includes(id))MX.sel=MX.sel.filter(x=>x!==id);
      else if(MX.sel.length>=6){toast('Højst 6 kort ad gangen');break}
      else MX.sel.push(id);
      renderSheet(false);break;
    case 'tone':MX.tone=k;renderSheet(false);break;
    case 'gen':
      if(MX.sel.length<2)break;
      MX.result={text:buildPrompt(MX.sel),len:MX.len,cre:MX.cre,tone:MX.tone,title:'Mix: '+MX.sel.map(i=>BY[i].title).slice(0,2).join(' + ')+(MX.sel.length>2?' m.fl.':'')};
      MX.savedId=null;renderSheet(true);break;
    case 'newmix':MX.result=null;MX.savedId=null;renderSheet(true);break;
    case 'savemix':
      if(MX.savedId){S.mixes=S.mixes.filter(m=>m.id!==MX.savedId);MX.savedId=null;toast('Fjernet fra dine mix')}
      else{MX.savedId='mix-'+Date.now();S.mixes.unshift({id:MX.savedId,title:MX.result.title,text:MX.result.text});toast('Mix gemt i Favoritter')}
      save();refresh();break;
    case 'openmix':openSheet({kind:'savedmix',id});break;
    case 'delmix':S.mixes=S.mixes.filter(m=>m.id!==id);save();closeSheet();render();toast('Mix slettet');break;
    case 'ttab':toolTab=k;render();$('#view').scrollTop=0;break;
    case 'ttype':toolType=k;render();break;
    case 'tool':openSheet({kind:'tool',id});break;
    case 'kit':
      if(S.kit.includes(id)){S.kit=S.kit.filter(x=>x!==id);toast(TB[id].name+' fjernet fra kassen')}
      else{S.kit.push(id);toast(TB[id].name+' lagt i kassen')}
      save();refresh();break;
    case 'addpack':{
      const pk=PACKS.find(x=>x.id===k);let n=0;pk.tools.forEach(t=>{if(!S.kit.includes(t)){S.kit.push(t);n++}});
      save();toast(pk.name+': '+n+' værktøjer lagt i kassen');render();break}
    case 'step':{
      const sk=skey(TB[id]);const arr=S.steps[sk]||(S.steps[sk]=[]);arr[+b.dataset.n]=!arr[+b.dataset.n];
      const st=stepsOf(TB[id]);if(st.every((_,i)=>arr[i]))toast(TB[id].name+' er klar til brug');
      save();render();const el=document.querySelector('[data-a="step"][data-id="'+id+'"][data-n="'+b.dataset.n+'"]');if(el)el.focus({preventScroll:true});break}
    case 'level':S.level=+k;D.order=null;save();render();break;
    case 'tech':S.tech=!S.tech;D.order=null;save();render();toast(S.tech?'Tekniske kort vises':'Tekniske kort er skjult');{const t=$('#tech');if(t)t.focus({preventScroll:true})}break;
    case 'ai':S.ai=k;save();render();toast(AIS[k].name+' er nu standard');break;
    case 'theme':S.theme=k;save();applyTheme();render();break;
    case 'reset':
      if(!confirmReset){confirmReset=true;render();setTimeout(()=>{confirmReset=false;if(route()==='indstillinger')render()},4000)}
      else{S=DEF();confirmReset=false;D={topic:'alle',order:null,idx:0,hist:[]};MX.result=null;save();applyTheme();go('velkommen');toast('Alt er nulstillet')}
      break;
  }
});
document.addEventListener('input',e=>{
  const i=e.target;if(i&&i.matches){
    if(i.matches('input[data-kx]')){const p=BY[i.dataset.kx];if(p){kbState(p).extra=i.value;kbUpdate(p.id)}return}
    if(i.matches('input[data-kq]')){const p=BY[i.dataset.kq];if(p){kbState(p).q=i.value;kbFilterChips(p.id)}return}
  }
  if(!i||!i.matches||!i.matches('input[data-pf]'))return;
  const key=i.dataset.pf;(PF[key]||(PF[key]={}))[i.dataset.t]=i.value;
  pfRefresh(key);
});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='acc')accOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='wn'){e.preventDefault();const b=document.querySelector('[data-a="start"]');if(b)b.click();return}
  if(sheet){if(e.key==='Escape'){e.preventDefault();closeSheet()}return}
  if(route()!=='swipe'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowRight'){e.preventDefault();decide('yes')}
  else if(k==='ArrowLeft'){e.preventDefault();decide('no')}
  else if(k==='ArrowUp'){e.preventDefault();decide('super')}
  else if(k==='z'||k==='Z'||k==='Backspace'){e.preventDefault();undo()}
  else if(k==='ArrowDown'||k==='Enter'){if(D.order&&D.order[D.idx]&&!(e.target.closest&&e.target.closest('button,a'))){e.preventDefault();openSheet({kind:'prompt',id:D.order[D.idx]})}}
});
window.addEventListener('hashchange',()=>{
  if(sheet)closeSheet(true);
  if(route()!=='velkommen'&&!S.welcomed){S.welcomed=true;save()}
  render();
  if(pending){const p=pending;pending=null;openSheet(p)}
});

  im.alt='';
},true);

/* ---------- «Sådan bruger du koden»: glidende fold ud/ind ---------- */
document.addEventListener('click',e=>{
  const s=e.target.closest?e.target.closest('details.kbsteps>summary'):null;if(!s)return;
  e.preventDefault();
  const d=s.parentNode,b=d.querySelector('.kbbody');if(!b)return;
  const opening=d._closing||!d.open;
  if(d._a){d._a.cancel();d._a=null}
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches||!b.animate;
  if(opening){
    d._closing=false;d.open=true;
    if(still)return;
    const a=d._a=b.animate([{height:'0px',opacity:0},{height:b.offsetHeight+'px',opacity:1}],{duration:220,easing:'ease-out'});
    a.onfinish=a.oncancel=()=>{if(d._a===a)d._a=null};
  }else{
    if(still){d.open=false;return}
    d._closing=true;
    const a=d._a=b.animate([{height:b.offsetHeight+'px',opacity:1},{height:'0px',opacity:0}],{duration:180,easing:'ease-in'});
    a.onfinish=()=>{if(d._a===a){d._a=null;d._closing=false;d.open=false}};
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.id==='kbsteps'&&!d.open)kbGuideId=null},true);

/* ---------- indlæsning af data.json (prompts, koder, billeder) ---------- */
(function(){
  const v=document.getElementById('view');
  function fail(){
    v.innerHTML='<div class="skel-err" role="alert"><p><b>Kunne ikke hente indholdet.</b><br>Tjek din forbindelse, og prøv igen.</p><button class="btn" id="dretry" type="button">Prøv igen</button></div>';
    document.getElementById('dretry').addEventListener('click',()=>{v.innerHTML=SKEL;load(true)});
  }
  const SKEL=v.innerHTML;
  function load(fresh){
    fetch('data.json',fresh?{cache:'reload'}:undefined)
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(d=>{boot(d)},fail);
  }
  load(false);
})();
</script>
